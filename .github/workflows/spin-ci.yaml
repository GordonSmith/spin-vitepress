name: "Spin-CI"

on:
  push:
    branches:
      - "main"

permissions:
  contents: write

env:
  NODE_VERSION: "22.23.2"
  RUST_VERSION: "1.97.0"
  RUST_TARGET: "wasm32-wasip1"
  WIT_BINDGEN_VERSION: "0.62.0"
  SPIN_VERSION: "4.2.1"
  JS2WASM_VERSION: "0.6.1"
  CLOUD_PLUGIN_VERSION: "0.11.0"
  AKA_PLUGIN_VERSION: "0.7.6"
  FERMYON_CLOUD_TOKEN: ${{ secrets.FERMYON_CLOUD }}
  SPIN_AKA_ACCESS_TOKEN: ${{ secrets.SPIN_AKA_ACCESS_TOKEN }}
  SPIN_AKA_ACCOUNT_NAME: "gordonsmith"
  SPIN_AKA_APP_NAME: "vitepress"
  # GitHub OAuth App credentials (one app per deployment, as each has its own callback URL)
  OAUTH_CLOUD_CLIENT_ID: ${{ secrets.OAUTH_CLOUD_CLIENT_ID }}
  OAUTH_CLOUD_CLIENT_SECRET: ${{ secrets.OAUTH_CLOUD_CLIENT_SECRET }}
  OAUTH_AKA_CLIENT_ID: ${{ secrets.OAUTH_AKA_CLIENT_ID }}
  OAUTH_AKA_CLIENT_SECRET: ${{ secrets.OAUTH_AKA_CLIENT_SECRET }}

jobs:

  spin:
    runs-on: "ubuntu-latest"
    name: Build Spin App
    steps:

      - name: Checkout sources
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Spin
        uses: fermyon/actions/spin/setup@v1.0.12
        with:
          version: "v${{ env.SPIN_VERSION }}"

      - name: Install Spin plugins
        run: |
          spin plugins update
          spin plugins install js2wasm --version ${{ env.JS2WASM_VERSION }} --yes

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test-ts/package-lock.json

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            test-rust -> target
            test-oauth -> target

      - name: Install rust dependencies
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --target ${{ env.RUST_TARGET }}
          rustup default ${{ env.RUST_VERSION }}
          cargo install wit-bindgen-cli --version ${{ env.WIT_BINDGEN_VERSION }} --locked

      - name: Restore C++ build dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            wasi-sdk
            build/vcpkg_downloads
            build/vcpkg_installed
            ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-cpp-${{ hashFiles('scripts/cpp-install-wasi-sdk.sh', 'scripts/cpp-install-vcpkg.sh', 'vcpkg.json', 'vcpkg-configuration.json', 'vcpkg_overlays/**', 'test-c/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cpp-

      - name: Install root Node dependencies
        run: |
          npm ci

      - name: Install C++ build dependencies
        run: |
          npm run install-build-deps

      - name: Install test-ts Node dependencies
        working-directory: test-ts
        run: |
          npm ci

      - name: Bump and sync versions
        run: |
          npm run version-bump-auto
          npm run sync-version

      - name: Build vitepress
        run: |
          spin build

      - name: Deploy to Fermyon Cloud
        if: ${{ env.FERMYON_CLOUD_TOKEN != '' }}
        id: deploy-cloud
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p ci-logs
          spin --version | tee ci-logs/spin-version.log
          spin plugin install cloud --version ${{ env.CLOUD_PLUGIN_VERSION }} --yes 2>&1 | tee ci-logs/cloud-plugin-install.log
          spin plugins list 2>&1 | tee ci-logs/spin-plugins.log
          spin cloud login --token "${FERMYON_CLOUD_TOKEN}"
          oauth_vars=()
          if [ -n "${OAUTH_CLOUD_CLIENT_ID}" ] && [ -n "${OAUTH_CLOUD_CLIENT_SECRET}" ]; then
            oauth_vars=(--variable "oauth_client_id=${OAUTH_CLOUD_CLIENT_ID}" --variable "oauth_client_secret=${OAUTH_CLOUD_CLIENT_SECRET}")
          fi
          spin cloud deploy -f spin.toml "${oauth_vars[@]}" 2>&1 | tee ci-logs/cloud-deploy.log

      - name: Deploy to Fermyon Wasm Functions
        if: ${{ env.SPIN_AKA_ACCESS_TOKEN != '' }}
        id: deploy-aka
        continue-on-error: true
        run: |
          spin plugin install aka --version ${{ env.AKA_PLUGIN_VERSION }} --yes
          spin aka login --token "${SPIN_AKA_ACCESS_TOKEN}"
          oauth_vars=()
          if [ -n "${OAUTH_AKA_CLIENT_ID}" ] && [ -n "${OAUTH_AKA_CLIENT_SECRET}" ]; then
            oauth_vars=(--variable "oauth_client_id=${OAUTH_AKA_CLIENT_ID}" --variable "oauth_client_secret=${OAUTH_AKA_CLIENT_SECRET}")
          fi
          spin aka deploy --no-confirm "${oauth_vars[@]}"

      - name: Check deployment outcomes
        if: ${{ always() && steps.deploy-cloud.outcome == 'failure' }}
        run: |
          echo "Fermyon Cloud deployment failed. Download the spin-logs artifact for complete diagnostic output."
          exit 1

      - name: Commit version changes
        run: |
          if git diff --quiet -- package.json package-lock.json spin.toml; then
            echo "No version changes to commit"
            exit 0
          fi

          version="v$(node -p "require('./package.json').version")"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json spin.toml
          git commit -m "chore(release): ${version} [skip ci]"

          if git rev-parse --verify --quiet "refs/tags/${version}"; then
            echo "Tag ${version} already exists"
          else
            git tag "${version}"
          fi

          git push
          git push --tags

      - name: Upload Spin logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: spin-logs
          path: |
            ci-logs/**
            .spin/logs/**
            .spin-aka/logs/**
          if-no-files-found: ignore
