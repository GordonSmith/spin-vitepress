[package]
name = "test-oauth"
authors = ["Gordon Smith <GordonJSmith@gmail.com>"]
description = "GitHub OAuth login component for Spin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
base64 = "0.23.1"
form_urlencoded = "1.2.2"
getrandom = "0.3"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
spin-sdk = "5.2.0"

[workspace]
